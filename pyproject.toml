[project]
name = "hearth-and-havoc"
version = "0.1.0"
description = "Server-authoritative backend for Hearth & Havoc"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.6,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests", "tests"]
addopts = "-q"

[tool.setuptools]
package-dir = {"" = "backend"}
packages = ["app", "app.domain"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
